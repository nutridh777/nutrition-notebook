<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Yuji+Syuku&display=swap');
    .brush { font-family: 'Yuji Boku', 'Yuji Syuku', serif; }
  </style>
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="80" fill="#EDE7D9"/>
  <g filter="url(#rough)" fill="#1A1917">
    <text x="150" y="235" class="brush" font-size="215" text-anchor="middle">ぬ</text>
    <text x="300" y="335" class="brush" font-size="215" text-anchor="middle">ん</text>
    <text x="420" y="440" class="brush" font-size="215" text-anchor="middle">！</text>
  </g>
</svg>
