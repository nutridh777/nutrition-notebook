<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>栄養ノート</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2F4A54" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #EDE7D9;
    background-image: radial-gradient(circle at 1px 1px, rgba(43,42,38,0.05) 1px, transparent 0);
    background-size: 18px 18px;
    font-family: 'Noto Sans JP', sans-serif;
    color: #2B2A26;
    padding: 20px 10px 60px;
  }
  :root {
    --paper-card: #F6F2E8;
    --ink: #2B2A26;
    --ink-soft: #6E6656;
    --indigo: #2F4A54;
    --indigo-soft: #4C6B72;
    --protein: #5B7B54;
    --fat: #C08A2E;
    --carb: #A65C3E;
    --line: #D5CBB2;
  }
  .notebook-root { max-width: 640px; margin: 0 auto; }
  .nb-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 20px; }
  .nb-title { font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 26px; letter-spacing: 0.04em; margin: 0; }
  .nb-date-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .nb-date-row input[type=date] { font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: #fff; }
  .today-btn { font-size: 11px; color: var(--indigo); background: none; border: 1px solid var(--indigo); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
  .nb-stamp { width: 78px; height: 78px; border-radius: 50%; border: 2.5px solid var(--carb); color: var(--carb); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; transform: rotate(-6deg); flex-shrink: 0; }
  .nb-stamp .num { font-size: 19px; font-weight: 700; line-height: 1; }
  .nb-stamp .unit { font-size: 9px; margin-top: 2px; }
  .nb-section-title { font-family: 'Shippori Mincho', serif; font-size: 15px; font-weight: 700; color: var(--indigo); margin: 0 0 12px; }
  .nb-gauges, .nb-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 22px; }
  .gauge-row { margin-bottom: 14px; }
  .gauge-label { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; color: var(--ink-soft); }
  .gauge-label b { color: var(--ink); font-weight: 700; }
  .gauge-track { height: 8px; background: #E3DCC8; border-radius: 5px; overflow: hidden; }
  .gauge-fill { height: 100%; border-radius: 5px; }
  .tab-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn { font-size: 12.5px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .tab-btn.active { background: var(--indigo); color: #F6F2E8; border-color: var(--indigo); }
  select, input[type=number], input[type=text], input[type=date] { font-family: 'Noto Sans JP', sans-serif; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; color: var(--ink); }
  .form-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .add-btn { display: inline-flex; align-items: center; gap: 5px; background: var(--indigo); color: #F6F2E8; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 10px; }
  .add-btn:hover { background: var(--indigo-soft); }
  .entry-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .entry-row:last-child { border-bottom: none; }
  .entry-name { font-weight: 500; }
  .entry-macro { color: var(--ink-soft); font-size: 11.5px; margin-top: 2px; }
  .entry-time { color: var(--ink-soft); font-size: 11px; width: 40px; }
  .del-btn { background: none; border: none; color: #9B4A3D; cursor: pointer; padding: 4px; font-size: 15px; }
  .empty-note { color: var(--ink-soft); font-size: 12.5px; padding: 8px 0; }
  .settings-toggle { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--indigo); cursor: pointer; background: none; border: none; padding: 0; font-weight: 500; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink-soft); margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .composer-total { margin-top: 12px; padding: 10px 12px; background: #E8E0C9; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--indigo); }
  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-stack { width: 100%; max-width: 30px; display: flex; flex-direction: column-reverse; border-radius: 3px 3px 0 0; overflow: hidden; }
  .bar-day-label { font-size: 10px; color: var(--ink-soft); margin-top: 5px; }
  .backup-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .file-label { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 1px solid var(--line); color: var(--indigo); border-radius: 8px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .file-label input { display: none; }
  .backup-msg { font-size: 11.5px; margin-top: 8px; }
  .backup-msg.ok { color: var(--protein); }
  .backup-msg.err { color: #9B4A3D; }
  .backup-note { font-size: 11.5px; color: var(--ink-soft); margin: 0 0 12px; }
  .scan-video { width: 100%; max-width: 320px; border-radius: 10px; border: 1px solid var(--line); display: block; margin: 10px auto; background: #000; }
  .scan-hint { font-size: 11.5px; color: var(--ink-soft); text-align: center; margin: 6px 0; }
  .scan-error { font-size: 12px; color: #9B4A3D; margin: 8px 0; }
  .barcode-hit { background: #E8E0C9; border-radius: 8px; padding: 12px; margin-top: 10px; }
  .barcode-hit .entry-name { font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const STORAGE_KEY = "nutrition-notebook-data";

const PRESETS = [
  // ここは食事を記録する「リストから選ぶ」の初期候補です。
  // 今は空にしてあります。「オリジナル料理を登録する」から料理を登録すると、
  // それが自動的に「自分の料理」として選択肢に反映されます。
];

const INGREDIENTS = [
  { id: "ig1", name: "餅", kcal: 223, protein: 4.3, fat: 0.8, carb: 50.3 },
  { id: "ig2", name: "生姜", kcal: 30, protein: 0.9, fat: 0.3, carb: 6.6 },
  { id: "ig3", name: "鶏むね挽肉", kcal: 150, protein: 17.0, fat: 9.0, carb: 0 },
  { id: "ig4", name: "ほうれん草", kcal: 20, protein: 2.2, fat: 0.4, carb: 3.1 },
  { id: "ig5", name: "大根", kcal: 18, protein: 0.5, fat: 0.1, carb: 4.1 },
  { id: "ig6", name: "だし", kcal: 2, protein: 0.2, fat: 0, carb: 0.4 },
  { id: "ig7", name: "白米(炊飯後)", kcal: 168, protein: 2.5, fat: 0.3, carb: 37.1 },
  { id: "ig8", name: "鶏むね肉(皮なし)", kcal: 108, protein: 22.3, fat: 1.5, carb: 0 },
  { id: "ig9", name: "豚こま切れ肉", kcal: 221, protein: 18.5, fat: 15.1, carb: 0.1 },
  { id: "ig10", name: "玉ねぎ", kcal: 37, protein: 1.0, fat: 0.1, carb: 8.4 },
  { id: "ig11", name: "にんじん", kcal: 39, protein: 0.6, fat: 0.1, carb: 9.1 },
  { id: "ig12", name: "木綿豆腐", kcal: 72, protein: 6.6, fat: 4.2, carb: 1.6 },
  { id: "ig13", name: "卵", kcal: 142, protein: 12.2, fat: 9.4, carb: 3.4 },
];

const DEFAULT_TARGETS = { protein: 60, fat: 50, carb: 250 };

function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtLabel(dateKey) {
  const d = new Date(dateKey + "T00:00:00");
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function fmtLong(dateKey) {
  const d = new Date(dateKey + "T00:00:00");
  return d.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
}
function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { entries: {}, targets: DEFAULT_TARGETS, customPresets: [], barcodeProducts: {}, customIngredients: [] };
}

function App() {
  const [data, setData] = useState(loadData);
  const [saveError, setSaveError] = useState(false);
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [mode, setMode] = useState("preset");
  const [selectedPreset, setSelectedPreset] = useState((data.customPresets && data.customPresets[0] && data.customPresets[0].id) || "");
  const [servings, setServings] = useState(1);
  const [manual, setManual] = useState({ name: "", kcal: "", protein: "", fat: "", carb: "" });
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [targetsDraft, setTargetsDraft] = useState(data.targets || DEFAULT_TARGETS);
  const [composerOpen, setComposerOpen] = useState(false);
  const [dishName, setDishName] = useState("");
  const [rows, setRows] = useState([{ id: uid(), ingredientId: INGREDIENTS[0].id, grams: 100 }]);
  const [newIngredientOpen, setNewIngredientOpen] = useState(false);
  const [newIngredient, setNewIngredient] = useState({ name: "", kcal: "", protein: "", fat: "", carb: "" });
  const [backupMsg, setBackupMsg] = useState(null);
  const [scanOpen, setScanOpen] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState(null);
  const [scannedCode, setScannedCode] = useState(null);
  const [newBarcodeForm, setNewBarcodeForm] = useState({ name: "", kcal: "", protein: "", fat: "", carb: "" });
  const readerRef = React.useRef(null);

  function persist(next) {
    setData(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  }

  const dayEntries = (data.entries && data.entries[selectedDate]) || [];
  const totals = useMemo(() => dayEntries.reduce((acc, e) => ({
    kcal: acc.kcal + e.kcal, protein: acc.protein + e.protein, fat: acc.fat + e.fat, carb: acc.carb + e.carb,
  }), { kcal: 0, protein: 0, fat: 0, carb: 0 }), [dayEntries]);

  const targets = data.targets || DEFAULT_TARGETS;
  const customPresets = data.customPresets || [];
  const customIngredients = data.customIngredients || [];
  const allIngredients = [...INGREDIENTS, ...customIngredients];
  const barcodeProducts = data.barcodeProducts || {};
  const allPresets = [...PRESETS, ...customPresets]; // PRESETSは空なので実質customPresetsのみ

  const composerTotals = useMemo(() => rows.reduce((acc, row) => {
    if (row.ingredientId === "custom") {
      return {
        kcal: acc.kcal + (Number(row.customKcal) || 0),
        protein: acc.protein + (Number(row.customProtein) || 0),
        fat: acc.fat + (Number(row.customFat) || 0),
        carb: acc.carb + (Number(row.customCarb) || 0),
      };
    }
    const ing = allIngredients.find(i => i.id === row.ingredientId);
    const factor = (Number(row.grams) || 0) / 100;
    if (!ing) return acc;
    return { kcal: acc.kcal + ing.kcal * factor, protein: acc.protein + ing.protein * factor, fat: acc.fat + ing.fat * factor, carb: acc.carb + ing.carb * factor };
  }, { kcal: 0, protein: 0, fat: 0, carb: 0 }), [rows, allIngredients]);

  const last7 = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = todayKey(d);
      const list = (data.entries && data.entries[key]) || [];
      const sums = list.reduce((acc, e) => ({ kcal: acc.kcal + e.kcal, protein: acc.protein + e.protein, fat: acc.fat + e.fat, carb: acc.carb + e.carb }), { kcal: 0, protein: 0, fat: 0, carb: 0 });
      days.push({ date: fmtLabel(key), ...sums });
    }
    return days;
  }, [data]);
  const maxDay = Math.max(1, ...last7.map(d => d.protein + d.fat + d.carb));
  const weeklyTotal = useMemo(() => last7.reduce((acc, d) => ({
    kcal: acc.kcal + d.kcal, protein: acc.protein + d.protein, fat: acc.fat + d.fat, carb: acc.carb + d.carb,
  }), { kcal: 0, protein: 0, fat: 0, carb: 0 }), [last7]);

  function addRow() { setRows([...rows, { id: uid(), ingredientId: INGREDIENTS[0].id, grams: 100 }]); }
  function updateRow(id, field, value) { setRows(rows.map(r => r.id === id ? { ...r, [field]: value } : r)); }
  function removeRow(id) { setRows(rows.filter(r => r.id !== id)); }

  function saveCustomPreset() {
    if (!dishName.trim() || rows.length === 0) return;
    const preset = { id: uid(), name: dishName.trim(), unit: "1人前",
      kcal: Math.round(composerTotals.kcal * 10) / 10, protein: Math.round(composerTotals.protein * 10) / 10,
      fat: Math.round(composerTotals.fat * 10) / 10, carb: Math.round(composerTotals.carb * 10) / 10 };
    persist({ ...data, customPresets: [...customPresets, preset] });
    setDishName(""); setRows([{ id: uid(), ingredientId: INGREDIENTS[0].id, grams: 100 }]);
    setSelectedPreset(preset.id); setComposerOpen(false);
  }
  function deleteCustomPreset(id) {
    persist({ ...data, customPresets: customPresets.filter(p => p.id !== id) });
    if (selectedPreset === id) setSelectedPreset((customPresets.find(p => p.id !== id) || {}).id || "");
  }

  function saveCustomIngredient() {
    if (!newIngredient.name.trim()) return;
    const ing = {
      id: uid(),
      name: newIngredient.name.trim(),
      kcal: Number(newIngredient.kcal) || 0,
      protein: Number(newIngredient.protein) || 0,
      fat: Number(newIngredient.fat) || 0,
      carb: Number(newIngredient.carb) || 0,
    };
    persist({ ...data, customIngredients: [...customIngredients, ing] });
    setNewIngredient({ name: "", kcal: "", protein: "", fat: "", carb: "" });
    setNewIngredientOpen(false);
  }

  function deleteCustomIngredient(id) {
    persist({ ...data, customIngredients: customIngredients.filter(i => i.id !== id) });
    setRows(rows.map(r => r.ingredientId === id ? { ...r, ingredientId: INGREDIENTS[0].id } : r));
  }
  function addEntry(entry) {
    const nextEntries = { ...data.entries };
    const list = nextEntries[selectedDate] ? [...nextEntries[selectedDate]] : [];
    list.push({ id: uid(), time: new Date().toTimeString().slice(0, 5), ...entry });
    nextEntries[selectedDate] = list;
    persist({ ...data, entries: nextEntries });
  }
  function removeEntry(id) {
    const nextEntries = { ...data.entries };
    nextEntries[selectedDate] = (nextEntries[selectedDate] || []).filter(e => e.id !== id);
    persist({ ...data, entries: nextEntries });
  }
  function handleAddPreset() {
    const preset = allPresets.find(p => p.id === selectedPreset);
    if (!preset) return;
    const mult = Number(servings) || 1;
    addEntry({ name: `${preset.name} ×${mult}`, kcal: Math.round(preset.kcal * mult * 10) / 10,
      protein: Math.round(preset.protein * mult * 10) / 10, fat: Math.round(preset.fat * mult * 10) / 10, carb: Math.round(preset.carb * mult * 10) / 10 });
    setServings(1);
  }
  function handleAddManual() {
    if (!manual.name.trim()) return;
    addEntry({ name: manual.name.trim(), kcal: Number(manual.kcal) || 0, protein: Number(manual.protein) || 0, fat: Number(manual.fat) || 0, carb: Number(manual.carb) || 0 });
    setManual({ name: "", kcal: "", protein: "", fat: "", carb: "" });
  }
  function stopScan() {
    if (readerRef.current) {
      try { readerRef.current.reset(); } catch (e) {}
      readerRef.current = null;
    }
    setScanning(false);
  }

  function startScan() {
    setScanError(null);
    setScannedCode(null);
    setNewBarcodeForm({ name: "", kcal: "", protein: "", fat: "", carb: "" });
    if (typeof ZXing === "undefined") {
      setScanError("バーコード読み取り機能を読み込めませんでした。通信状況をご確認の上、再読み込みしてください。");
      return;
    }
    setScanning(true);
    setTimeout(() => {
      try {
        const codeReader = new ZXing.BrowserMultiFormatReader();
        readerRef.current = codeReader;
        codeReader.decodeOnceFromVideoDevice(undefined, "barcode-video")
          .then(result => {
            setScannedCode(result.getText());
            stopScan();
          })
          .catch(() => {
            setScanError("カメラを起動できませんでした。カメラの使用を許可しているかご確認ください。");
            stopScan();
          });
      } catch (e) {
        setScanError("カメラを起動できませんでした。");
        stopScan();
      }
    }, 50);
  }

  function addFromBarcode(code) {
    const product = barcodeProducts[code];
    if (!product) return;
    addEntry({ name: product.name, kcal: product.kcal, protein: product.protein, fat: product.fat, carb: product.carb });
    setScannedCode(null);
    setScanOpen(false);
  }

  function saveBarcodeProduct(code) {
    if (!newBarcodeForm.name.trim()) return;
    const product = {
      name: newBarcodeForm.name.trim(),
      kcal: Number(newBarcodeForm.kcal) || 0,
      protein: Number(newBarcodeForm.protein) || 0,
      fat: Number(newBarcodeForm.fat) || 0,
      carb: Number(newBarcodeForm.carb) || 0,
    };
    const nextBarcodeProducts = { ...barcodeProducts, [code]: product };
    persist({ ...data, barcodeProducts: nextBarcodeProducts });
    addEntry(product);
    setScannedCode(null);
    setNewBarcodeForm({ name: "", kcal: "", protein: "", fat: "", carb: "" });
    setScanOpen(false);
  }

  function deleteBarcodeProduct(code) {
    const next = { ...barcodeProducts };
    delete next[code];
    persist({ ...data, barcodeProducts: next });
  }

  function saveTargets() { persist({ ...data, targets: targetsDraft }); setSettingsOpen(false); }

  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = todayKey();
      a.href = url;
      a.download = `nutrition-notebook-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setBackupMsg({ type: "ok", text: "バックアップを保存しました。" });
    } catch (e) {
      setBackupMsg({ type: "err", text: "バックアップの作成に失敗しました。" });
    }
  }

  function importBackup(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (typeof parsed !== "object" || parsed === null || !parsed.entries) {
          throw new Error("invalid");
        }
        const next = {
          entries: parsed.entries || {},
          targets: parsed.targets || DEFAULT_TARGETS,
          customPresets: parsed.customPresets || [],
          barcodeProducts: parsed.barcodeProducts || {},
          customIngredients: parsed.customIngredients || [],
        };
        persist(next);
        setTargetsDraft(next.targets);
        setBackupMsg({ type: "ok", text: "バックアップから復元しました。" });
      } catch (e) {
        setBackupMsg({ type: "err", text: "ファイルを読み込めませんでした。正しいバックアップファイルか確認してください。" });
      }
    };
    reader.onerror = () => setBackupMsg({ type: "err", text: "ファイルの読み込みに失敗しました。" });
    reader.readAsText(file);
  }

  const isToday = selectedDate === todayKey();

  useEffect(() => {
    return () => { if (readerRef.current) { try { readerRef.current.reset(); } catch (e) {} } };
  }, []);

  return (
    <div className="notebook-root">
      <div className="nb-header">
        <div>
          <p className="nb-title">栄養ノート</p>
          <div className="nb-date-row">
            <input type="date" value={selectedDate} max={todayKey()} onChange={e => setSelectedDate(e.target.value)} />
            {!isToday && <button className="today-btn" onClick={() => setSelectedDate(todayKey())}>今日に戻る</button>}
          </div>
        </div>
        <div className="nb-stamp"><span className="num">{Math.round(totals.kcal)}</span><span className="unit">kcal</span></div>
      </div>

      <div className="nb-gauges">
        <p className="nb-section-title">{fmtLong(selectedDate)}のPFC</p>
        {[{ key: "protein", label: "たんぱく質", color: "var(--protein)" }, { key: "fat", label: "脂質", color: "var(--fat)" }, { key: "carb", label: "炭水化物", color: "var(--carb)" }].map(m => {
          const val = totals[m.key]; const target = targets[m.key] || 1; const pct = Math.min(100, (val / target) * 100);
          return (
            <div className="gauge-row" key={m.key}>
              <div className="gauge-label"><span>{m.label}</span><b>{Math.round(val * 10) / 10}g / {target}g</b></div>
              <div className="gauge-track"><div className="gauge-fill" style={{ width: `${pct}%`, background: m.color }} /></div>
            </div>
          );
        })}
        <button className="settings-toggle" onClick={() => setSettingsOpen(s => !s)} style={{ marginBottom: 12 }}>⚙ 目標グラム数を編集</button>
        {settingsOpen && (
          <div style={{ paddingBottom: 14 }}>
            <div className="form-grid" style={{ gridTemplateColumns: "1fr 1fr 1fr" }}>
              {["protein", "fat", "carb"].map(k => (
                <label key={k} style={{ fontSize: 11.5, color: "var(--ink-soft)" }}>
                  {k === "protein" ? "たんぱく質(g)" : k === "fat" ? "脂質(g)" : "炭水化物(g)"}
                  <input type="number" value={targetsDraft[k]} onChange={e => setTargetsDraft({ ...targetsDraft, [k]: Number(e.target.value) })} style={{ width: "100%", marginTop: 3 }} />
                </label>
              ))}
            </div>
            <button className="add-btn" onClick={saveTargets}>目標を保存</button>
          </div>
        )}
      </div>

      <div className="nb-card">
        <p className="nb-section-title">＋ 食事を記録する</p>
        <div className="tab-row">
          <button className={`tab-btn ${mode === "preset" ? "active" : ""}`} onClick={() => setMode("preset")}>リストから選ぶ</button>
          <button className={`tab-btn ${mode === "manual" ? "active" : ""}`} onClick={() => setMode("manual")}>手入力する</button>
        </div>
        {mode === "preset" ? (
          customPresets.length === 0 ? (
            <p className="empty-note">まだ登録された料理がありません。「📝 オリジナル料理を登録する」から料理を登録すると、ここに自動で表示されます。</p>
          ) : (
            <div className="form-row">
              <select value={selectedPreset} onChange={e => setSelectedPreset(e.target.value)} style={{ flex: 1, minWidth: 160 }}>
                {customPresets.map(p => <option key={p.id} value={p.id}>{p.name}（{p.unit}）</option>)}
              </select>
              <input type="number" min="0.5" step="0.5" value={servings} onChange={e => setServings(e.target.value)} style={{ width: 60 }} />
              <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>人前</span>
              <button className="add-btn" style={{ marginTop: 0 }} onClick={handleAddPreset}>＋ 追加</button>
            </div>
          )
        ) : (
          <div>
            <input type="text" placeholder="食品名" value={manual.name} onChange={e => setManual({ ...manual, name: e.target.value })} style={{ width: "100%" }} />
            <div className="form-grid">
              <input type="number" placeholder="カロリー(kcal)" value={manual.kcal} onChange={e => setManual({ ...manual, kcal: e.target.value })} />
              <input type="number" placeholder="たんぱく質(g)" value={manual.protein} onChange={e => setManual({ ...manual, protein: e.target.value })} />
              <input type="number" placeholder="脂質(g)" value={manual.fat} onChange={e => setManual({ ...manual, fat: e.target.value })} />
              <input type="number" placeholder="炭水化物(g)" value={manual.carb} onChange={e => setManual({ ...manual, carb: e.target.value })} />
            </div>
            <button className="add-btn" onClick={handleAddManual}>＋ 追加</button>
          </div>
        )}
      </div>

      <div className="nb-card">
        <button className="settings-toggle" onClick={() => { const next = !scanOpen; setScanOpen(next); if (!next) stopScan(); setScannedCode(null); setScanError(null); }}>
          📷 バーコードでかんたん記録
        </button>
        {scanOpen && (
          <div style={{ marginTop: 14 }}>
            <p className="backup-note">よく買う商品を一度登録しておくと、次回からはスキャンするだけで記録できます。未登録の商品はその場で登録できます。</p>

            {!scanning && !scannedCode && (
              <button className="add-btn" style={{ marginTop: 0 }} onClick={startScan}>スキャン開始</button>
            )}
            {scanning && (
              <div>
                <video id="barcode-video" className="scan-video" muted playsInline></video>
                <p className="scan-hint">バーコードを画面の中央に映してください</p>
                <button className="tab-btn" onClick={stopScan}>キャンセル</button>
              </div>
            )}
            {scanError && <p className="scan-error">{scanError}</p>}

            {scannedCode && barcodeProducts[scannedCode] && (
              <div className="barcode-hit">
                <div className="entry-name">{barcodeProducts[scannedCode].name}</div>
                <div className="entry-macro">
                  {barcodeProducts[scannedCode].kcal}kcal ／ P{barcodeProducts[scannedCode].protein}g ・ F{barcodeProducts[scannedCode].fat}g ・ C{barcodeProducts[scannedCode].carb}g
                </div>
                <button className="add-btn" onClick={() => addFromBarcode(scannedCode)}>＋ この内容で記録に追加</button>
              </div>
            )}
            {scannedCode && !barcodeProducts[scannedCode] && (
              <div className="barcode-hit">
                <p style={{ fontSize: 12.5, margin: "0 0 8px" }}>このバーコード（{scannedCode}）は未登録です。栄養情報を入力して登録すると、次回から自動で呼び出せます。</p>
                <input type="text" placeholder="商品名" value={newBarcodeForm.name} onChange={e => setNewBarcodeForm({ ...newBarcodeForm, name: e.target.value })} style={{ width: "100%" }} />
                <div className="form-grid">
                  <input type="number" placeholder="カロリー(kcal)" value={newBarcodeForm.kcal} onChange={e => setNewBarcodeForm({ ...newBarcodeForm, kcal: e.target.value })} />
                  <input type="number" placeholder="たんぱく質(g)" value={newBarcodeForm.protein} onChange={e => setNewBarcodeForm({ ...newBarcodeForm, protein: e.target.value })} />
                  <input type="number" placeholder="脂質(g)" value={newBarcodeForm.fat} onChange={e => setNewBarcodeForm({ ...newBarcodeForm, fat: e.target.value })} />
                  <input type="number" placeholder="炭水化物(g)" value={newBarcodeForm.carb} onChange={e => setNewBarcodeForm({ ...newBarcodeForm, carb: e.target.value })} />
                </div>
                <button className="add-btn" onClick={() => saveBarcodeProduct(scannedCode)}>＋ 登録して記録に追加</button>
              </div>
            )}

            {Object.keys(barcodeProducts).length > 0 && (
              <div style={{ marginTop: 16 }}>
                <p style={{ fontSize: 11.5, color: "var(--ink-soft)", margin: "0 0 6px" }}>登録済みの商品</p>
                {Object.entries(barcodeProducts).map(([code, p]) => (
                  <div className="entry-row" key={code}>
                    <div style={{ flex: 1 }}>
                      <div className="entry-name">{p.name}</div>
                      <div className="entry-macro">{p.kcal}kcal ／ P{p.protein}g ・ F{p.fat}g ・ C{p.carb}g</div>
                    </div>
                    <button className="del-btn" onClick={() => deleteBarcodeProduct(code)}>✕</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      <div className="nb-card">
        <button className="settings-toggle" onClick={() => setComposerOpen(s => !s)}>📝 オリジナル料理を登録する</button>
        {composerOpen && (
          <div style={{ marginTop: 14 }}>
            <p style={{ fontSize: 11.5, color: "var(--ink-soft)", margin: "0 0 10px" }}>材料とグラム数を入れると自動で合計し、いつもの料理として保存できます。リストにない材料は「手入力する」から栄養成分を直接入力できます。</p>
            <input type="text" placeholder="料理名" value={dishName} onChange={e => setDishName(e.target.value)} style={{ width: "100%", marginBottom: 10 }} />
            {rows.map(row => (
              <div key={row.id} style={{ marginBottom: 8 }}>
                <div className="form-row" style={{ marginBottom: row.ingredientId === "custom" ? 6 : 0 }}>
                  <select value={row.ingredientId} onChange={e => updateRow(row.id, "ingredientId", e.target.value)} style={{ flex: 1, minWidth: 130 }}>
                    {allIngredients.map(ing => <option key={ing.id} value={ing.id}>{ing.name}</option>)}
                    <option value="custom">✏️ 手入力する</option>
                  </select>
                  {row.ingredientId !== "custom" && (
                    <React.Fragment>
                      <input type="number" value={row.grams} onChange={e => updateRow(row.id, "grams", e.target.value)} style={{ width: 70 }} />
                      <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>g</span>
                    </React.Fragment>
                  )}
                  <button className="del-btn" onClick={() => removeRow(row.id)}>✕</button>
                </div>
                {row.ingredientId === "custom" && (
                  <div style={{ paddingLeft: 2 }}>
                    <input
                      type="text"
                      placeholder="材料名"
                      value={row.customName || ""}
                      onChange={e => updateRow(row.id, "customName", e.target.value)}
                      style={{ width: "100%", marginBottom: 6 }}
                    />
                    <div className="form-grid">
                      <input type="number" placeholder="カロリー(kcal)" value={row.customKcal || ""} onChange={e => updateRow(row.id, "customKcal", e.target.value)} />
                      <input type="number" placeholder="たんぱく質(g)" value={row.customProtein || ""} onChange={e => updateRow(row.id, "customProtein", e.target.value)} />
                      <input type="number" placeholder="脂質(g)" value={row.customFat || ""} onChange={e => updateRow(row.id, "customFat", e.target.value)} />
                      <input type="number" placeholder="炭水化物(g)" value={row.customCarb || ""} onChange={e => updateRow(row.id, "customCarb", e.target.value)} />
                    </div>
                    <p style={{ fontSize: 11, color: "var(--ink-soft)", margin: "4px 0 0" }}>※実際に使った分量ぶんの栄養成分を入力してください（100gあたりではありません）</p>
                  </div>
                )}
              </div>
            ))}
            <button className="tab-btn" onClick={addRow}>＋ 材料を追加</button>

            <div style={{ marginTop: 10 }}>
              <button className="settings-toggle" style={{ fontSize: 12.5 }} onClick={() => setNewIngredientOpen(s => !s)}>
                🧺 選択肢に無い材料をリストに追加する
              </button>
              {newIngredientOpen && (
                <div style={{ marginTop: 8, padding: 10, background: "#fff", border: "1px solid var(--line)", borderRadius: 8 }}>
                  <input
                    type="text"
                    placeholder="材料名"
                    value={newIngredient.name}
                    onChange={e => setNewIngredient({ ...newIngredient, name: e.target.value })}
                    style={{ width: "100%", marginBottom: 6 }}
                  />
                  <div className="form-grid">
                    <input type="number" placeholder="カロリー(kcal/100g)" value={newIngredient.kcal} onChange={e => setNewIngredient({ ...newIngredient, kcal: e.target.value })} />
                    <input type="number" placeholder="たんぱく質(g/100g)" value={newIngredient.protein} onChange={e => setNewIngredient({ ...newIngredient, protein: e.target.value })} />
                    <input type="number" placeholder="脂質(g/100g)" value={newIngredient.fat} onChange={e => setNewIngredient({ ...newIngredient, fat: e.target.value })} />
                    <input type="number" placeholder="炭水化物(g/100g)" value={newIngredient.carb} onChange={e => setNewIngredient({ ...newIngredient, carb: e.target.value })} />
                  </div>
                  <p style={{ fontSize: 11, color: "var(--ink-soft)", margin: "4px 0 0" }}>※100gあたりの栄養成分を入力してください。登録後は材料の選択肢に追加され、グラム数を入れるだけで使えるようになります。</p>
                  <button className="add-btn" onClick={saveCustomIngredient}>＋ この材料をリストに追加</button>
                </div>
              )}
              {customIngredients.length > 0 && (
                <div style={{ marginTop: 10 }}>
                  <p style={{ fontSize: 11.5, color: "var(--ink-soft)", margin: "0 0 6px" }}>追加した材料</p>
                  {customIngredients.map(ing => (
                    <div className="entry-row" key={ing.id}>
                      <div style={{ flex: 1 }}>
                        <div className="entry-name">{ing.name}</div>
                        <div className="entry-macro">100gあたり {ing.kcal}kcal ／ P{ing.protein}g ・ F{ing.fat}g ・ C{ing.carb}g</div>
                      </div>
                      <button className="del-btn" onClick={() => deleteCustomIngredient(ing.id)}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="composer-total">合計：{Math.round(composerTotals.kcal)}kcal ／ P{Math.round(composerTotals.protein * 10) / 10}g ・ F{Math.round(composerTotals.fat * 10) / 10}g ・ C{Math.round(composerTotals.carb * 10) / 10}g</div>
            <button className="add-btn" onClick={saveCustomPreset}>＋ この料理をリストに保存</button>
            {customPresets.length > 0 && (
              <div style={{ marginTop: 16 }}>
                <p style={{ fontSize: 11.5, color: "var(--ink-soft)", margin: "0 0 6px" }}>登録済みの料理</p>
                {customPresets.map(p => (
                  <div className="entry-row" key={p.id}>
                    <div style={{ flex: 1 }}>
                      <div className="entry-name">{p.name}</div>
                      <div className="entry-macro">{p.kcal}kcal ／ P{p.protein}g ・ F{p.fat}g ・ C{p.carb}g</div>
                    </div>
                    <button className="del-btn" onClick={() => deleteCustomPreset(p.id)}>✕</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      <div className="nb-card">
        <p className="nb-section-title">{fmtLong(selectedDate)}の記録</p>
        {dayEntries.length === 0 && <p className="empty-note">この日の記録はまだありません。</p>}
        {dayEntries.map(e => (
          <div className="entry-row" key={e.id}>
            <span className="entry-time">{e.time}</span>
            <div style={{ flex: 1, marginLeft: 8 }}>
              <div className="entry-name">{e.name}</div>
              <div className="entry-macro">{e.kcal}kcal ／ P{e.protein}g ・ F{e.fat}g ・ C{e.carb}g</div>
            </div>
            <button className="del-btn" onClick={() => removeEntry(e.id)}>✕</button>
          </div>
        ))}
      </div>

      <div className="nb-card">
        <p className="nb-section-title">過去7日間の推移</p>
        <div className="legend">
          <span><i className="dot" style={{ background: "var(--protein)" }} />たんぱく質</span>
          <span><i className="dot" style={{ background: "var(--fat)" }} />脂質</span>
          <span><i className="dot" style={{ background: "var(--carb)" }} />炭水化物</span>
        </div>
        <div className="bar-chart">
          {last7.map((d, idx) => {
            const total = d.protein + d.fat + d.carb;
            const heightPct = (total / maxDay) * 100;
            return (
              <div className="bar-col" key={idx}>
                <div className="bar-stack" style={{ height: `${heightPct}%` }}>
                  <div style={{ height: `${(d.carb / (total || 1)) * 100}%`, background: "var(--carb)" }} />
                  <div style={{ height: `${(d.fat / (total || 1)) * 100}%`, background: "var(--fat)" }} />
                  <div style={{ height: `${(d.protein / (total || 1)) * 100}%`, background: "var(--protein)" }} />
                </div>
                <span className="bar-day-label">{d.date}</span>
              </div>
            );
          })}
        </div>
        <div className="composer-total" style={{ background: "#E3DCC8" }}>
          <div style={{ marginBottom: 4 }}>合計摂取量（過去7日間）：{Math.round(weeklyTotal.kcal)}kcal</div>
          <div style={{ fontWeight: 400, fontSize: 12.5 }}>
            たんぱく質 {Math.round(weeklyTotal.protein * 10) / 10}g ・ 脂質 {Math.round(weeklyTotal.fat * 10) / 10}g ・ 炭水化物 {Math.round(weeklyTotal.carb * 10) / 10}g
          </div>
          <div style={{ fontWeight: 400, fontSize: 11, color: "var(--ink-soft)", marginTop: 4 }}>
            1日平均：{Math.round(weeklyTotal.kcal / 7)}kcal ／ P{Math.round((weeklyTotal.protein / 7) * 10) / 10}g ・ F{Math.round((weeklyTotal.fat / 7) * 10) / 10}g ・ C{Math.round((weeklyTotal.carb / 7) * 10) / 10}g
          </div>
        </div>
        {saveError && <p style={{ fontSize: 11, color: "#9B4A3D", marginTop: 8 }}>端末への保存に失敗しました。ブラウザのプライベートモードなどをご確認ください。</p>}
      </div>

      <div className="nb-card" style={{ marginBottom: 0 }}>
        <p className="nb-section-title">💾 バックアップ</p>
        <p className="backup-note">端末を変えたり、うっかりデータを消してしまったときのために、記録をファイルとして保存・復元できます。</p>
        <div className="backup-row">
          <button className="add-btn" style={{ marginTop: 0 }} onClick={exportBackup}>バックアップを保存</button>
          <label className="file-label">
            バックアップから復元
            <input type="file" accept="application/json" onChange={e => { importBackup(e.target.files[0]); e.target.value = ""; }} />
          </label>
        </div>
        {backupMsg && <p className={`backup-msg ${backupMsg.type}`}>{backupMsg.text}</p>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
